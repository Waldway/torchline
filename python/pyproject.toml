[project]
name = "torchline"
version = "0.1.0"
description = "Training, analysis and export scripts for the Torchline neural saturation plugin"
readme = "README.md"
authors = [
    { name = "vewilya", email = "vewilya@me.com" }
]
requires-python = ">=3.14"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.5",
]
